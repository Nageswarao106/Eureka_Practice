<script>
    let celsius = +prompt ("Enter temp in celsius");
    let fahrunheit = (celsius * 9/5) +32;
    console.log(`${celsius}°C is equal to ${fahrunheit}°F`);


    let fahrunheit1 = +prompt ("Enter temp in fahrunheit");
    let celsius1 = (fahrunheit1 - 32) * 5/9;
    console.log(`${fahrunheit1}°F is equal to ${celsius1}°C`);
</script>
