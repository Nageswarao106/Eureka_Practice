<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Billing Information</title>
</head>
<body>
    <h2 class="text-center">Billing Information</h2> 

    <form method="post" class="border border-3 rounded-3 p-3 col-sm-4 offset-sm-4" autocomplete="on">
      <p>
            <label for="fname">First Name:</label>
            <input type="search" id="fname" placeholder="Enter your first name" required autofocus>
       </p> 
          <p>          
            <label for="lname">Last Name:</label>
            <input type="text" id="lname" required><br>
         </p>
         <p>
            <label for="Gender">Gender:</label>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label><br>
         </p>
          <p>
            <label for = "language">Language:</label>
            <input type="checkbox" id="language" name="language" value="Telugu">
            <label for="language">Telugu</label>
            <input type="checkbox" id="language" name="language" value="Tamil">
            <label for="language">Tamil</label>
            <input type="checkbox" id="language" name="language" value="Kannada">
            <label for="language">Kannada</label>
            <input type="checkbox" id="language" name="language" value="Malayalam">
            <label for="language">Malayalam</label>
            <input type="checkbox" id="language" name="language" value="Hindi">
            <label for="language">Hindi</label><br>
        </p>    
         <p>     
            <label for="email">Email:</label>
            <input type="email"id="email" name="email" placeholder="user@example.com" required>
           </p>   
          <p>    
            <label for="address">Address:</label>
            <input type="textArea" id="address"  required>
           </p>
          <p> 
           <label>State:</label>
            <select id="state"> 
                <option>Andhra Pradesh</option>
                <option>Bihar</option>
                <option>Telangana</option>
                <option>Tamil Nadu</option>
                <option>Karnataka</option>
                <option>Kerala</option>
            </select>
            </p>
            <p>     
            <label for="zip">Zip Code:</label>
            <input type="text"id="zip" name="zip" size="10" maxlength="5" pattern="[0-9]{5}" title="Please enter a valid 5-digit zip code" required>
            </p>
            <p>
            <label for="card">Card Number:</label>
            <select id="card">
                <option value="masterCard">Master Card</option>
                <option value="visa">Visa</option>
                <option value="ruPay">RuPay</option>
            </select>
             </p>       

        <button type="submit" class="btn btn-primary">Submit</button>

        <button type="reset" class="btn btn-secondary">Reset</button>

    </form>
</body>
</html>
