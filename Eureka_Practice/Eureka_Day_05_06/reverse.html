<script>
    let num = +prompt("Enter a number");
    function reverseNumber(num, rev = 0) {
        if (num === 0) {
            return rev;
        }
        return reverseNumber(Math.floor(num / 10), rev * 10 + (num % 10));
    }

    let reversed = reverseNumber(num);
    console.log(`Reversed number: ${reversed}`);
</script>
